# =============================================================================
# Aarthiq Frontend - Docker Compose Configuration
# =============================================================================
# Project: Aarthiq (Capital Bridge Nepal)
# Services: Frontend (Next.js)
# =============================================================================

name: aarthiq-frontend

services:
  # ===========================================================================
  # Frontend Service
  # ===========================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aarthiq_frontend
    restart: unless-stopped
    ports:
      # Frontend - localhost only (reverse proxy handles public access)
      - "127.0.0.1:8080:8080"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - aarthiq_frontend_network

# =============================================================================
# Networks
# =============================================================================
networks:
  aarthiq_frontend_network:
    driver: bridge
    name: aarthiq_frontend_network
